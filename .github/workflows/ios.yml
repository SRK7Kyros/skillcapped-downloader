name: iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version baked into the IPA
        required: false
        default: "1.3.1"
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.version || '1.3.0' }}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in data[runtime]:
                  if device.get("name", "").startswith("iPhone"):
                      print(device["name"])
                      raise SystemExit
          ')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Testing on $DEVICE"

      - name: Unit and UI tests
        working-directory: ios
        timeout-minutes: 14
        run: |
          set +e
          xcodebuild test \
            -project SkillCappedLocal.xcodeproj \
            -scheme SkillCappedLocal \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            > "$RUNNER_TEMP/tests.log" 2>&1
          STATUS=$?
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ test|error:|\*\* TEST" "$RUNNER_TEMP/tests.log" | tail -80
          if [ $STATUS -ne 0 ]; then
            echo "--- failing tests ---"
            grep -E "Test Case .* failed|error:" "$RUNNER_TEMP/tests.log" | head -40
          fi
          exit $STATUS

      - name: Show the test log tail
        if: always()
        run: tail -80 "$RUNNER_TEMP/tests.log" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkillCappedLocal-tests
          path: ${{ runner.temp }}/tests.xcresult
          if-no-files-found: ignore

      - name: Build the unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project SkillCappedLocal.xcodeproj \
            -scheme SkillCappedLocal \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/dd \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package the IPA
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          rm -rf build/Payload build/SkillCappedLocal.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          # No entitlements, on purpose. An earlier build declared an iCloud
          # container so the folder picker would accept it, but the refusal was
          # never about iCloud: iOS 26 refuses a folder-only picker whatever
          # `asCopy` says (see ios/SkillCappedLocal/Support/PickerProbe.m), and a
          # container cannot be granted to a sideloaded signature anyway, so
          # declaring one only asked for something the device cannot authorize.
          cd build
          zip -qry SkillCappedLocal.ipa Payload
          unzip -l SkillCappedLocal.ipa | head -20

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkillCappedLocal-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: build/SkillCappedLocal.ipa
          if-no-files-found: error
