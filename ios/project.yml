name: SkillCappedLocal
options:
  bundleIdPrefix: com.kyros
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.25.1"
    CURRENT_PROJECT_VERSION: "9"

targets:
  SkillCappedLocal:
    type: application
    platform: iOS
    sources:
      - path: SkillCappedLocal
        excludes:
          - "Info.plist"
      - path: Shared
    dependencies:
      - target: SkillCappedLocalWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: SkillCappedLocal
        PRODUCT_BUNDLE_IDENTIFIER: com.kyros.skillcappedlocal
        INFOPLIST_FILE: SkillCappedLocal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: SkillCappedLocal/Support/Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - SkillCappedLocalTests
        - SkillCappedLocalUITests
      gatherCoverageData: false

  # The lock-screen face of the queue. Only a Live Activity, so the gallery has
  # no home-screen widget to offer — which is the point.
  SkillCappedLocalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SkillCappedLocalWidget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SkillCappedLocalWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.kyros.skillcappedlocal.widget
        INFOPLIST_FILE: SkillCappedLocalWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""

  SkillCappedLocalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkillCappedLocalTests
        excludes:
          - "Fixtures/**"
      - path: SkillCappedLocalTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SkillCappedLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyros.skillcappedlocal.tests
        GENERATE_INFOPLIST_FILE: YES

  SkillCappedLocalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SkillCappedLocalUITests
    dependencies:
      - target: SkillCappedLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyros.skillcappedlocal.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SkillCappedLocal
