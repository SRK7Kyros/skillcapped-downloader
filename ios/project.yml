name: SkillCappedLocal
options:
  bundleIdPrefix: com.kyros
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SkillCappedLocal:
    type: application
    platform: iOS
    sources:
      - path: SkillCappedLocal
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: SkillCappedLocal
        PRODUCT_BUNDLE_IDENTIFIER: com.kyros.skillcappedlocal
        INFOPLIST_FILE: SkillCappedLocal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - SkillCappedLocalTests
        - SkillCappedLocalUITests
      gatherCoverageData: false

  SkillCappedLocalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SkillCappedLocalTests
    dependencies:
      - target: SkillCappedLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyros.skillcappedlocal.tests
        GENERATE_INFOPLIST_FILE: YES

  SkillCappedLocalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SkillCappedLocalUITests
    dependencies:
      - target: SkillCappedLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyros.skillcappedlocal.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SkillCappedLocal
